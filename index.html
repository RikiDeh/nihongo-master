<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NihongoMaster — Belajar Bahasa Jepang 0 sampai N1</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=hanko" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=hanko" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=hanko" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png?v=hanko" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=hanko" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#c84b31" />
    <script>
      try {
        const theme = localStorage.getItem('nihongo_theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#faf8f5] dark:bg-[#18181b] text-[#1c1917] dark:text-[#f4f4f5] antialiased selection:bg-[#c84b31] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
